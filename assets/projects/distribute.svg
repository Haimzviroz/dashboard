<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="2">
  <!-- Central box (representing software) -->
  <rect x="8" y="8" width="8" height="8" fill="#0078D4" stroke="#004A99" rx="1" />

  <!-- Outward arrows -->
  <!-- Top arrow -->
  <line x1="12" y1="8" x2="12" y2="4" stroke="#004A99" stroke-width="1" />
  <polygon points="11,5 13,5 12,4" fill="#004A99" />

  <!-- Bottom arrow -->
  <line x1="12" y1="16" x2="12" y2="20" stroke="#004A99" stroke-width="1" />
  <polygon points="11,19 13,19 12,20" fill="#004A99" />

  <!-- Left arrow -->
  <line x1="8" y1="12" x2="4" y2="12" stroke="#004A99" stroke-width="1" />
  <polygon points="5,11 5,13 4,12" fill="#004A99" />

  <!-- Right arrow -->
  <line x1="16" y1="12" x2="20" y2="12" stroke="#004A99" stroke-width="1" />
  <polygon points="19,11 19,13 20,12" fill="#004A99" />

  <!-- Devices -->
  <!-- Top device -->
  <rect x="11.5" y="2.5" width="1" height="1" fill="#9FCFFF" stroke="#004A99" rx="0.2" />

  <!-- Bottom device -->
  <rect x="11.5" y="20.5" width="1" height="1" fill="#9FCFFF" stroke="#004A99" rx="0.2" />

  <!-- Left device -->
  <rect x="2.5" y="11.5" width="1" height="1" fill="#9FCFFF" stroke="#004A99" rx="0.2" />

  <!-- Right device -->
  <rect x="20.5" y="11.5" width="1" height="1" fill="#9FCFFF" stroke="#004A99" rx="0.2" />
</svg>
